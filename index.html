<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Simple Blog</h1>
  </header>

  <main class="container">
    <h2>Welcome to My First Blog Post</h2>
    <p>
      This is a simple example of a blog page made with plain HTML, CSS, and JavaScript.
      You can add your thoughts below in the comment section.
      In a real app, these comments would be saved to a server or database.
    </p>

    <section id="commentsSection">
      <h3>Comments</h3>
      <div id="commentsList"></div>

      <textarea id="commentInput" placeholder="Write your comment..."></textarea>
      <button id="postBtn">Post Comment</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
